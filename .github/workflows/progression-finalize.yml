name: Finalize Progression Collection 01

on:
  push:
    branches:
      - progression-collection-01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progression-collection-01
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/finalize_progression_collection.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Finalize Phase 5 docs and review corrections
          file_pattern: README.md AGENTS.md docs/PRODUCT.md docs/TECHNICAL_DIRECTION.md docs/IMPLEMENTATION_ROADMAP.md docs/CONTENT_AND_PROGRESSION.md docs/RENDERER_REUSE_SECOND_SHAPE.md docs/RENDERER_REUSE_SECOND_SHAPE_IMPLEMENTATION_REVIEW.md src/game/VerticalSliceApp.ts src/styles.css
