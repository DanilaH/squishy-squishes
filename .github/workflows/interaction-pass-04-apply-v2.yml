name: Apply Interaction Pass 04 v2

on:
  push:
    branches:
      - interaction-pass-04

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: interaction-pass-04
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_interaction_pass_04.py

      - name: Validate diff
        run: git diff --check

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/interaction-pass.css src/squish/shaders.ts
          git commit -m "Tune craft pacing and mold crit interactions"
          git push origin HEAD:interaction-pass-04
