name: Sandbox S3 Temporary Decor Stage

on:
  push:
    branches:
      - sandbox-pivot-s3-decor

permissions:
  contents: write

jobs:
  decor-stage:
    if: startsWith(github.event.head_commit.message, 'Arm Sandbox S3 decor stage validation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s3-decor
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply Decor stage
        run: node scripts/apply-sandbox-s3-ui.mjs
      - run: npm install
      - run: npm run release:check
      - name: Commit validated Decor stage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxApp.ts src/sandbox-core.css
          git diff --cached --check
          git commit -m "Build Sandbox S3 Decor stage"
          git push origin HEAD:sandbox-pivot-s3-decor
