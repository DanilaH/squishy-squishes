name: Sandbox S1 Temporary Validation

on:
  push:
    branches:
      - sandbox-pivot-s1-core

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:yandex
      - run: npm run verify:yandex
