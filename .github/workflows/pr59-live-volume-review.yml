name: PR 59 live volume draw-order trial
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-live-volume-review.yml]
permissions:
  contents: write
jobs:
  live-volume:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Trial the sidewall after the deformed front in the existing WebGL pass
        run: python3 scripts/pr59-volume-layer-order.py && git diff --check && git diff --stat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Strict Pages build
        run: npm run pages:build
      - name: Same three V3 cross-scene browser scenarios
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Capture screenshots to judge the line, not just build success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-volume-draw-order-trial
          path: |
            test-results/**/library-hall-parity-*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit Pages-only draw order after strict browser gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiments/phaser/PhaserSquishCandidate.ts
          git commit -m 'fix(review): cover front-side antialias seam with deforming sidewall'
          git push origin HEAD:feat/library-visual-recovery-sep21
