name: PR 59 isolated live volume integration
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-live-volume-review.yml]
permissions:
  contents: write
jobs:
  live-volume:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Patch only the isolated Pages Phaser render pipeline
        run: python3 scripts/pr59-live-volume-apply.py && git diff --check && git diff --stat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Strict TypeScript and Pages preview build
        run: npm run pages:build
      - name: Real saved V3 paw, heart, and jelly through craft, squeeze, Hall, and reopen
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Upload honest browser evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-live-volume-first-pass
          path: |
            test-results/**/library-hall-parity-*.png
            test-results/**/library-hall-parity-*.json
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit only validated Pages renderer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiments/phaser/PhaserSquishCandidate.ts src/sandbox/PhaserSquishSurface.ts src/experiments/phaser/pagesPreview.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
          git commit -m 'feat(review): render deforming volume sidewall in Pages craft and squeeze'
          git push origin HEAD:feat/library-visual-recovery-sep21
