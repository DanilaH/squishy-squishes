name: PR 59 live volume seam trial
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-live-volume-review.yml]
permissions:
  contents: write
jobs:
  live-volume:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Overlap the deforming front and side without changing original renderer
        run: python3 scripts/pr59-live-volume-seam.py && git diff --check && git diff --stat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Strict TypeScript and Pages preview build
        run: npm run pages:build
      - name: Actual V3 paw, heart, jelly through studio, squeeze, Hall, reopen
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Capture evidence for independent seam inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-live-volume-seam-trial
          path: |
            test-results/**/library-hall-parity-*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit tested Pages-only seam adjustment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiments/phaser/PhaserDeformableVolume.ts
          git commit -m 'fix(review): tuck deforming sidewall beneath front cap'
          git push origin HEAD:feat/library-visual-recovery-sep21
