name: PR 59 temporary finished-mold visual parity patch
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-finished-mold-parity-patch.yml]
permissions:
  contents: write
jobs:
  finished-mold-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Match finished Studio mold in 3D and seat crown
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mesh = Path('src/experiments/phaser/libraryVolumeMesh.ts')
          text = mesh.read_text()
          old = 'gl_Position = vec4(p.x * 0.80, p.y * 0.80, -p.z * 0.16, 1.0);'
          new = '''// Match the finished Studio mold and the existing neutral albedo UVs:
            // +7.5% horizontal stretch, -9.5% vertical stretch, -1.8% seat.
            gl_Position = vec4(p.x * 0.80 * 1.075, (p.y * 0.905 - 0.018) * 0.80, -p.z * 0.16, 1.0);'''
          if text.count(old) != 1: raise RuntimeError('Unexpected mesh transform')
          mesh.write_text(text.replace(old, new))
          thumbnail = Path('src/sandbox/libraryThumbnail.ts')
          text = thumbnail.read_text()
          old = "toy.decor.accessory === 'crown' ? 27 : 0;"
          new = "toy.decor.accessory === 'crown' ? 11 : 0;"
          if text.count(old) != 1: raise RuntimeError('Unexpected crown placement')
          thumbnail.write_text(text.replace(old,new))
          PY
          git diff --check
          git diff --stat
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pages:build
      - name: Create and reopen actual V3 paw, heart and square; capture appearance
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Upload all visual evidence and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-finished-mold-parity
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Push verified, limited renderer changes to existing draft branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiments/phaser/libraryVolumeMesh.ts src/sandbox/libraryThumbnail.ts
          git commit -m 'fix(pages): align 3D Library silhouette with finished Studio mold'
          git push origin HEAD:feat/library-visual-recovery-sep21
