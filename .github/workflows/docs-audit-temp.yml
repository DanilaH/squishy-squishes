name: Documentation and repository hygiene audit (temporary)
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/docs-audit-temp.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Full-tree docs, links, blobs, and referrers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          import re, subprocess
          root=Path('.')
          paths=[Path(x) for x in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if x]
          docs=sorted(p for p in paths if p.suffix.lower()=='.md' and p.parts[0]=='docs')
          scan=[p for p in paths if p.suffix.lower() in {'.md','.ts','.tsx','.js','.mjs','.cjs','.json','.yml','.yaml','.html','.css','.py'} and p.exists() and p.stat().st_size<400_000]
          content={p:p.read_text('utf-8', errors='replace') for p in scan}
          print(f'TRACKED total={len(paths)} docs={len(docs)} scan_files={len(scan)}')
          for prefix in ['docs/','scripts/','src/','tests/','public/','biba/','.github/']:
            members=[p for p in paths if str(p).startswith(prefix)]
            print(f'GROUP {prefix}: files={len(members)}, bytes={sum(p.stat().st_size for p in members if p.exists())}')
          print('DOC REFERRERS (excluding self):')
          for d in docs:
            refs=[str(p) for p,t in content.items() if p!=d and (str(d) in t or d.name in t)]
            first=' '.join(refs[:7])
            print(f'DOC {str(d)} bytes={d.stat().st_size} refs={len(refs)} {first}{" +more" if len(refs)>7 else ""}')
          print('BROKEN LOCAL MARKDOWN LINKS:')
          errors=[]
          for p,t in content.items():
            if p.suffix.lower()!='.md': continue
            for match in re.finditer(r'\]\(([^)]+)\)',t):
              raw=match.group(1).strip().split()[0].strip('<>')
              if not raw or raw.startswith(('#','http:','https:','mailto:','data:','javascript:')): continue
              from urllib.parse import unquote
              item=unquote(raw.split('#')[0].split('?')[0])
              if not item: continue
              target=(root/item.lstrip('/')) if item.startswith('/') else (p.parent/item)
              if not target.exists(): errors.append((str(p),item))
          print(f'BROKEN_LINKS count={len(errors)}')
          for p,item in errors[:160]: print(f'BROKEN {p} -> {item}')
          if len(errors)>160: print(f'BROKEN_TRUNCATED {len(errors)-160}')
          print('LARGE TRACKED FILES >= 1 MiB:')
          for p in sorted((p for p in paths if p.exists() and p.stat().st_size>=1_000_000), key=lambda p:-p.stat().st_size)[:70]:
            refs=[str(q) for q,t in content.items() if q!=p and (str(p) in t or p.name in t)]
            print(f'LARGE {p.stat().st_size} {p} textual_refs={len(refs)} {" ".join(refs[:3])}')
          print('EXACT DUPLICATE BLOBS:')
          same=defaultdict(list)
          for line in subprocess.check_output(['git','ls-files','-s','-z']).decode().split('\0'):
            if not line: continue
            mode,sha,stagepath=line.split(' ',2)
            same[sha].append(stagepath.split('\t',1)[-1])
          for sha,names in same.items():
            if len(names)>1: print('DUP',sha[:12],*names[:12])
          PY