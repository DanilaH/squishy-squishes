name: Temporary Phaser Library Branch Patch
on:
  push:
    branches: [migration/phaser-library-v3]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/migration/phaser-library-v3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Inject candidate-only renderer into existing library
        run: node scripts/migration/patch-phaser-library-port.mjs
      - name: Commit only library port
        shell: bash
        run: |
          if git diff --quiet -- src/sandbox/SandboxLibraryApp.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sandbox/SandboxLibraryApp.ts
          git commit -m 'Allow isolated Phaser renderer factory in original Library app'
          git push origin HEAD:migration/phaser-library-v3
