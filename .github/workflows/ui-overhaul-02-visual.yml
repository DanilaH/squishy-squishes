name: UI Overhaul 02 Visual Validation

on:
  push:
    branches:
      - ui-ux-overhaul-02

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-overhaul-02
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate production builds
        run: npm run release:check
      - name: Capture production screenshots
        run: |
          node scripts/serve-release-qa.mjs > /tmp/squishy-visual-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';

          const paintDefaultShape = async (page) => {
            const workspace = page.locator('.lab-workspace');
            const box = await workspace.boundingBox();
            if (!box) throw new Error('Missing workspace box');
            const hero = Math.max(120, Math.min(box.width, box.height) * 0.68);
            const left = box.x + box.width / 2 - hero / 2;
            const top = box.y + box.height / 2 - hero / 2;
            const rows = 8;
            await page.mouse.move(left + hero * 0.12, top + hero * 0.12);
            await page.mouse.down();
            for (let row = 0; row < rows; row += 1) {
              const v = 0.12 + (0.76 * row) / (rows - 1);
              const startU = row % 2 === 0 ? 0.12 : 0.88;
              const endU = row % 2 === 0 ? 0.88 : 0.12;
              await page.mouse.move(left + hero * startU, top + hero * v, { steps: 4 });
              await page.mouse.move(left + hero * endU, top + hero * v, { steps: 24 });
            }
            await page.mouse.up();
          };

          const mixUntilMold = async (page) => {
            const shell = page.locator('.lab-shell');
            const box = await page.locator('.lab-workspace').boundingBox();
            if (!box) throw new Error('Missing workspace box');
            const cx = box.x + box.width / 2;
            const cy = box.y + box.height / 2;
            const dx = Math.min(145, box.width * 0.16);
            const dy = Math.min(125, box.height * 0.18);
            const points = [[cx + dx, cy], [cx, cy - dy], [cx - dx, cy], [cx, cy + dy]];
            for (let attempt = 0; attempt < 4; attempt += 1) {
              if ((await shell.getAttribute('data-stage')) !== 'mix') return;
              await page.mouse.move(cx, cy);
              await page.mouse.down();
              for (let index = 0; index < 18; index += 1) {
                const [x, y] = points[index % points.length];
                await page.mouse.move(x, y);
                await page.waitForTimeout(12);
              }
              await page.mouse.up();
              try {
                await page.waitForFunction(() => document.querySelector('.lab-shell')?.getAttribute('data-stage') === 'mold', null, { timeout: 1200 });
                return;
              } catch {}
            }
            throw new Error('Mix did not reach mold');
          };

          const finishMold = async (page) => {
            const shell = page.locator('.lab-shell');
            const target = page.locator('.mold-target');
            for (let press = 0; press < 18; press += 1) {
              if ((await shell.getAttribute('data-stage')) !== 'mold') return;
              await page.waitForFunction(() => {
                const shellElement = document.querySelector('.lab-shell');
                if (shellElement?.getAttribute('data-stage') !== 'mold') return true;
                const targetElement = document.querySelector('.mold-target');
                return targetElement instanceof HTMLButtonElement && !targetElement.hidden && !targetElement.disabled;
              }, null, { timeout: 800 });
              if ((await shell.getAttribute('data-stage')) !== 'mold') return;
              await target.dispatchEvent('pointerdown', {
                bubbles: true,
                pointerId: press + 1,
                button: 0,
                buttons: 1,
                pointerType: 'mouse',
              });
              await page.waitForTimeout(160);
            }
            if ((await shell.getAttribute('data-stage')) === 'mold') throw new Error('Mold did not complete');
          };

          await fs.mkdir('ui-overhaul-02-screens', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const targets = [
            ['phone-portrait', 390, 844],
            ['phone-landscape', 844, 390],
            ['desktop', 1280, 720],
          ];

          for (const [name, width, height] of targets) {
            const context = await browser.newContext({ viewport: { width, height }, locale: 'ru-RU' });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4177/squishy-squishes/', { waitUntil: 'networkidle' });
            const shell = page.locator('.lab-shell');
            await shell.waitFor();
            await page.screenshot({ path: `ui-overhaul-02-screens/${name}-choose.png`, fullPage: true });
            await page.getByRole('button', { name: 'Все сквиши' }).click();
            await page.locator('.collection-overlay').waitFor({ state: 'visible' });
            await page.screenshot({ path: `ui-overhaul-02-screens/${name}-collection.png`, fullPage: true });
            await page.getByRole('button', { name: 'Назад' }).click();
            if (name === 'phone-portrait') {
              await page.getByRole('button', { name: 'СДЕЛАТЬ' }).click();
              await page.locator('.lab-shell[data-stage="pour"]').waitFor();
              await page.screenshot({ path: 'ui-overhaul-02-screens/phone-portrait-craft.png', fullPage: true });
              await paintDefaultShape(page);
              await page.waitForFunction(() => document.querySelector('.lab-shell')?.getAttribute('data-stage') === 'mix', null, { timeout: 4000 });
              await mixUntilMold(page);
              await finishMold(page);
              await page.waitForFunction(() => document.querySelector('.lab-shell')?.getAttribute('data-stage') === 'test', null, { timeout: 5000 });
              await page.screenshot({ path: 'ui-overhaul-02-screens/phone-portrait-result.png', fullPage: true });
              await page.getByRole('button', { name: 'ЗАБРАТЬ' }).click();
              await page.waitForFunction(() => document.querySelector('.lab-shell')?.getAttribute('data-stage') === 'collect', null, { timeout: 1200 });
              await page.waitForTimeout(220);
              await page.screenshot({ path: 'ui-overhaul-02-screens/phone-portrait-collect.png', fullPage: true });
              await page.waitForFunction(() => document.querySelector('.lab-shell')?.getAttribute('data-stage') === 'select', null, { timeout: 2200 });
              await page.screenshot({ path: 'ui-overhaul-02-screens/phone-portrait-next.png', fullPage: true });
            }
            await context.close();
          }
          await browser.close();
          NODE
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-overhaul-02-screens
          path: ui-overhaul-02-screens
