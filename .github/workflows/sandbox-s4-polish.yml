name: Sandbox S4 Temporary Visual Polish

on:
  push:
    branches:
      - sandbox-pivot-s4-ideas-titles
    paths:
      - '.github/workflows/sandbox-s4-polish.yml'
      - 'scripts/apply-sandbox-s4-visual-polish.mjs'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s4-ideas-titles
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply visual polish
        run: node scripts/apply-sandbox-s4-visual-polish.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Validate complete release
        run: npm run qa:release
      - name: Check diff
        run: git diff --check
      - name: Commit validated product polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxLibraryApp.ts src/sandbox-ideas.css
          git commit -m "Polish Sandbox S4 Ideas cards"
          git push
