name: Tactile multi-touch evidence
on:
  push:
    branches: [qa/tactile-multitouch-evidence]
permissions:
  contents: read
jobs:
  touch-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 9aff6ab4cb4c8888660fe99bafbae096b1d31f98
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Capture real press hold release cancellation and audio
        run: npx playwright test tests/release/tactile-multitouch.spec.ts tests/release/tactile-press.spec.ts tests/release/playful-audio.spec.ts tests/release/playful-tools.spec.ts --grep 'two-finger|desktop touch|saved face|touch hold|material release' --config=playwright.release.config.ts --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tactile-multitouch-frames
          path: |
            migration-baseline-evidence/hold-*.png
            migration-baseline-evidence/multi-*.png
            migration-baseline-evidence/stroke-*.png
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tactile-multitouch-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
