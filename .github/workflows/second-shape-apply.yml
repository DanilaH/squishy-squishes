name: Apply Second Shape Gate

on:
  push:
    branches:
      - renderer-reuse-second-shape

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: renderer-reuse-second-shape
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/apply_second_shape.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Wire shared renderer through second shape
          file_pattern: src/squish/SquishSurface.ts src/game/VerticalSliceApp.ts src/styles.css
