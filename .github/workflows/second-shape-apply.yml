name: Apply Second Shape Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: renderer-reuse-second-shape
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/apply_second_shape.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
