name: Apply Second Shape Review Fix

on:
  push:
    branches:
      - renderer-reuse-second-shape

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: renderer-reuse-second-shape
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/fix_second_shape_review.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Harden generic mold target fallback
          file_pattern: src/game/VerticalSliceApp.ts
