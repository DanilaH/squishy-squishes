name: Temporary Phaser Studio Size Patch
on:
  push:
    branches: [migration/phaser-real-studio]
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/migration/phaser-real-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply exact-guarded canvas sizing correction
        run: node scripts/migration/patch-studio-canvas-size.mjs
      - name: Commit only the corrected Phaser surface
        shell: bash
        run: |
          if git diff --quiet -- src/sandbox/PhaserSquishSurface.ts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sandbox/PhaserSquishSurface.ts
          git commit -m 'Match Phaser backbuffer aspect to responsive studio canvas'
          git push origin HEAD:migration/phaser-real-studio
