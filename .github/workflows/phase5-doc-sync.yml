name: Sync Phase 5 Canonical Docs

on:
  push:
    branches:
      - progression-collection-01

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progression-collection-01
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/sync_phase5_docs.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Sync Phase 5 canonical documentation
          file_pattern: README.md AGENTS.md docs/PROGRESSION_COLLECTION_01.md docs/TECHNICAL_DIRECTION.md docs/IMPLEMENTATION_ROADMAP.md
