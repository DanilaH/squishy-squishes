name: PR 59 temporary soft rim evaluation
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-front-rim-parity.yml]
permissions:
  contents: write
jobs:
  rim-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Shade the actual 3D curved front edge, not the texture or studio simulation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/experiments/phaser/libraryVolumeMesh.ts')
          data=path.read_text()
          old='color = paint.rgb * (0.78 + 0.18 * diffuse);'
          new='''color = paint.rgb * (0.78 + 0.18 * diffuse);
              // Studio has a softly shaded edge. Give the 3D front the same
              // readable rounded rim from its normal, without baking highlights
              // into saved paint or flattening the actual side geometry.
              float frontRim = 1.0 - smoothstep(0.58, 0.91, n.z);
              color *= 1.0 - 0.17 * frontRim;'''
          if data.count(old)!=1:raise RuntimeError('Front lighting changed; do not patch blindly')
          path.write_text(data.replace(old,new))
          PY
          git diff --check
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pages:build
      - name: Recheck actual saved paw, heart, Jelly square and crown
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Retain every full-resolution comparison screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr59-soft-rim-review
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit tested shading only to the review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/experiments/phaser/libraryVolumeMesh.ts
          git commit -m 'fix(pages): softly shade curved mesh front rim like Studio'
          git push origin HEAD:feat/library-visual-recovery-sep21
