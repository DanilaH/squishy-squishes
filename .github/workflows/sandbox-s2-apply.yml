name: Sandbox S2 Temporary Apply

on:
  push:
    branches:
      - sandbox-pivot-s2-library

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Arm S2 integration patch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s2-library
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Adapt SandboxApp to library orchestration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/sandbox/SandboxApp.ts')
          s = p.read_text()
          old = """  readonly savedSquishy: SavedSquishy | null;\n  readonly onSaveSquishy: (draft: SandboxDraft) => Promise<SavedSquishy>;\n  readonly onMutedChange: (muted: boolean) => void | Promise<void>;\n"""
          new = """  readonly savedSquishy: SavedSquishy | null;\n  readonly startSavedInSqueeze?: boolean;\n  readonly onExitToLibrary?: () => void;\n  readonly onSaveSquishy: (draft: SandboxDraft) => Promise<SavedSquishy | null>;\n  readonly onMutedChange: (muted: boolean) => void | Promise<void>;\n"""
          if old not in s:
              raise SystemExit('SandboxApp options anchor not found')
          s = s.replace(old, new, 1)

          old = "    this.stage = this.savedSquishy ? 'home' : 'shape';"
          new = "    this.stage = this.savedSquishy ? (options.startSavedInSqueeze ? 'squeeze' : 'home') : 'shape';"
          if old not in s:
              raise SystemExit('SandboxApp initial stage anchor not found')
          s = s.replace(old, new, 1)

          old = "    else if (action === 'home') this.setStage(this.savedSquishy ? 'home' : 'shape');"
          new = """    else if (action === 'home') {\n      if (this.options.onExitToLibrary) this.options.onExitToLibrary();\n      else this.setStage(this.savedSquishy ? 'home' : 'shape');\n    }"""
          if old not in s:
              raise SystemExit('SandboxApp home action anchor not found')
          s = s.replace(old, new, 1)

          old = """      const saved = await this.options.onSaveSquishy(this.draft);\n      this.savedSquishy = saved;\n      this.shell.dataset.savedSquishyId = saved.id;\n"""
          new = """      const saved = await this.options.onSaveSquishy(this.draft);\n      if (!saved) {\n        this.status.textContent = '';\n        return;\n      }\n      this.savedSquishy = saved;\n      this.shell.dataset.savedSquishyId = saved.id;\n"""
          if old not in s:
              raise SystemExit('SandboxApp save anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run release:check
      - name: Commit validated S2 integration seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxApp.ts
          git diff --cached --check
          git commit -m "Adapt SandboxApp for personal library"
          git push origin HEAD:sandbox-pivot-s2-library
