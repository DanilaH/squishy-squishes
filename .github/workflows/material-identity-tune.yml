name: Tune Material Identity

on:
  push:
    branches:
      - sandbox-polish-materials-02

permissions:
  contents: write

jobs:
  tune:
    if: github.event.head_commit.message != 'Strengthen marshmallow and pearl identity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tune shader
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/game/content.ts',
              "  { id: 'pearl', label: 'Pearl', translucency: 0.10, iridescence: 0.10, roughness: 0.34, metallic: 0.10, pearlescence: 0.90, cloudiness: 0.10 },",
              "  { id: 'pearl', label: 'Pearl', translucency: 0.08, iridescence: 0.20, roughness: 0.30, metallic: 0.08, pearlescence: 1.0, cloudiness: 0.08 },",
          )

          replace_once(
              'src/squish/shaders.ts',
              '''  float cloudField = cloudA * 0.62 + cloudB * 0.38;\n  vec3 cloudyBase = mix(base, uSheenColor, 0.10 + cloudField * 0.12);\n  base = mix(base, cloudyBase, cloudiness * (0.66 + edge * 0.10));''',
              '''  float cloudField = cloudA * 0.62 + cloudB * 0.38;\n  float milkyWeight = cloudiness * (0.72 + cloudField * 0.18);\n  vec3 milkyTint = mix(uSheenColor, vec3(1.0), 0.42 + cloudField * 0.10);\n  vec3 cloudyBase = mix(base * (0.98 + cloudField * 0.025), milkyTint, 0.24 + cloudField * 0.10);\n  base = mix(base, cloudyBase, clamp(milkyWeight, 0.0, 0.86));''',
          )

          replace_once(
              'src/squish/shaders.ts',
              '''  float pearlescence = clamp(uPearlescence, 0.0, 1.0);\n  float pearlBand = 0.5 + 0.5 * sin((vUv.x * 0.78 + vUv.y * 0.55 + uMaterialSeed * 0.71 + uCompression * 0.06) * 6.2831853);\n  vec3 pearlSpectrum = mix(vec3(1.0), spectralColor(spectralPhase * 0.42 + 0.17), 0.30);\n  vec3 pearlSurface = base * (0.88 + pearlBand * 0.05) + pearlSpectrum * (0.08 + pearlBand * 0.08);\n  base = mix(base, pearlSurface, pearlescence * (0.58 + edge * 0.16));''',
              '''  float pearlescence = clamp(uPearlescence, 0.0, 1.0);\n  float pearlBand = 0.5 + 0.5 * sin((vUv.x * 0.78 + vUv.y * 0.55 + uMaterialSeed * 0.71 + uCompression * 0.06) * 6.2831853);\n  float pearlCross = 0.5 + 0.5 * sin((vUv.x * 0.44 - vUv.y * 0.67 + uMaterialSeed * 0.33) * 6.2831853);\n  vec3 pearlSpectrum = mix(vec3(1.0), spectralColor(spectralPhase * 0.46 + pearlCross * 0.14 + 0.12), 0.52);\n  vec3 pearlSurface = base * (0.92 + pearlBand * 0.035) + pearlSpectrum * (0.10 + pearlBand * 0.13);\n  base = mix(base, pearlSurface, pearlescence * (0.72 + edge * 0.14));''',
          )
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/content.ts src/squish/shaders.ts
          git commit -m "Strengthen marshmallow and pearl identity"
          git push origin HEAD:sandbox-polish-materials-02
