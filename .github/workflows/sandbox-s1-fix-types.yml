name: Sandbox S1 Temporary Source Fix

on:
  push:
    branches:
      - sandbox-pivot-s1-core

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'Arm S1 QA selector fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s1-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Harden permanent S1 browser selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/release/release.spec.ts')
          s = p.read_text()
          s = s.replace("  await expect(page.locator('.sandbox-shape:disabled')).toHaveCount(0);\n", "  await expect(page.locator('.sandbox-shape:disabled')).toHaveCount(0);\n  for (const shapeId of ['soft-square', 'heart', 'mochi', 'peach', 'mushroom', 'paw']) {\n    await page.locator(`[data-shape=\"${shapeId}\"]`).click();\n    await expect(shell).toHaveAttribute('data-shape', shapeId);\n  }\n")
          s = s.replace("  await page.locator('[data-paint-color=\"6547162\"]').click();", "  await page.locator('.sandbox-swatch').nth(1).click();")
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:yandex
      - run: npm run verify:yandex
      - name: Commit validated selector fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/release.spec.ts
          git diff --cached --check
          git commit -m "Harden Sandbox S1 browser selectors"
          git push origin HEAD:sandbox-pivot-s1-core
