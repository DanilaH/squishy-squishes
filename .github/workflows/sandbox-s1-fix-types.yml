name: Sandbox S1 Temporary Type Fix

on:
  push:
    branches:
      - sandbox-pivot-s1-core

permissions:
  contents: write

jobs:
  fix:
    if: startsWith(github.event.head_commit.message, 'Arm S1 type fixes')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s1-core
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply strict TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/sandbox/SandboxApp.ts')
          s = p.read_text()
          s = s.replace('  createEmptyAppearanceDocument,\n', '')
          s = s.replace('  private paintColor = PAINT_COLORS[0];', '  private paintColor: number = PAINT_COLORS[0];')
          s = s.replace('  private brushSize = BRUSH_SIZES[1];', '  private brushSize: number = BRUSH_SIZES[1];')
          s = s.replace('  private latestMetrics: SquishMetrics | null = null;\n', '')
          s = s.replace('    this.latestMetrics = metrics;\n', '')
          p.write_text(s)
          PY
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:yandex
      - run: npm run verify:yandex
      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxApp.ts
          git diff --cached --check
          git commit -m "Fix Sandbox S1 type contracts"
          git push origin HEAD:sandbox-pivot-s1-core
