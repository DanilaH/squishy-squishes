name: Final toy catalog art review
on:
  push:
    branches: [qa/toy-catalog-final-review]
    paths: [.github/workflows/toy-catalog-final-review.yml]
permissions:
  contents: read
jobs:
  art-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Capture proposed baselines for manual review only
        run: npm run qa:visual:update
      - name: Unmasked catalog, actual controls and fallback review
        run: npm run qa:browser -- tests/release/toy-catalog.spec.ts tests/release/toy-polish.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toy-catalog-final-art-review
          path: |
            tests/visual/*-snapshots
            migration-baseline-evidence
            test-results/**/*.png
            test-results/**/error-context.md
          retention-days: 14
