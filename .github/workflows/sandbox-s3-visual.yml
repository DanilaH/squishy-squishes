name: Sandbox S3 Temporary Visual Review

on:
  push:
    branches:
      - sandbox-pivot-s3-decor

permissions:
  contents: write

jobs:
  visual:
    if: startsWith(github.event.head_commit.message, 'Arm Sandbox S3 visual review') || startsWith(github.event.head_commit.message, 'Apply Sandbox S3 visual polish') || startsWith(github.event.head_commit.message, 'Apply Sandbox S3 accessory seat correction')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s3-decor
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply visual polish patch
        if: startsWith(github.event.head_commit.message, 'Apply Sandbox S3 visual polish')
        run: node scripts/apply-sandbox-s3-visual-polish.mjs
      - name: Apply accessory seat correction
        if: startsWith(github.event.head_commit.message, 'Apply Sandbox S3 accessory seat correction')
        run: node scripts/apply-sandbox-s3-accessory-seat.mjs
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture production visual states
        run: npx playwright test tests/release/s3-visual.spec.ts --config=playwright.release.config.ts
      - name: Upload temporary visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: s3-visual-review
          path: artifacts/s3-visual/*.png
          if-no-files-found: error
          retention-days: 1
      - name: Commit visual polish and temporary evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DanilaH@users.noreply.github.com"
          git add src/sandbox/SandboxApp.ts src/sandbox/decor.ts src/sandbox/libraryThumbnail.ts artifacts/s3-visual
          git diff --cached --check
          git commit -m "Seat S3 accessories on live surface projection"
          git push origin HEAD:sandbox-pivot-s3-decor
