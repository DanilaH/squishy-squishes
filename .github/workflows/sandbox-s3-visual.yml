name: Sandbox S3 Temporary Visual Review

# retry with an explicit Pages build before the release-QA server starts
on:
  push:
    branches:
      - sandbox-pivot-s3-decor

permissions:
  contents: write

jobs:
  visual:
    if: startsWith(github.event.head_commit.message, 'Arm Sandbox S3 visual review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s3-decor
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capture production visual states
        run: npx playwright test tests/release/s3-visual.spec.ts --config=playwright.release.config.ts
      - name: Prepare text review previews
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64
          import io

          root = Path('artifacts/s3-visual')
          review = root / 'review'
          review.mkdir(parents=True, exist_ok=True)
          for src in sorted(root.glob('*.png')):
              image = Image.open(src).convert('RGB')
              if image.width > 320:
                  height = round(image.height * 320 / image.width)
                  image = image.resize((320, height))
              buf = io.BytesIO()
              image.save(buf, format='JPEG', quality=25, optimize=True)
              encoded = base64.b64encode(buf.getvalue()).decode('ascii')
              wrapped = '\n'.join(encoded[i:i + 120] for i in range(0, len(encoded), 120))
              (review / f'{src.stem}.b64').write_text(wrapped)
          PY
      - name: Commit temporary visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DanilaH@users.noreply.github.com"
          git add artifacts/s3-visual
          git diff --cached --check
          git commit -m "Capture temporary S3 visual evidence"
          git push origin HEAD:sandbox-pivot-s3-decor
