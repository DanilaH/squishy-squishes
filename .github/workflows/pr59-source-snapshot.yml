name: PR 59 temporary source snapshot
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: [.github/workflows/pr59-source-snapshot.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Package source and tests, excluding bundled binary art
        run: tar -czf "$RUNNER_TEMP/pr59-source.tar.gz" src tests scripts docs package.json package-lock.json tsconfig.json vite.config.ts playwright.*.ts index.html phaser-*.html AGENTS.md README.md .github/workflows
      - uses: actions/upload-artifact@v4
        with:
          name: pr59-source-snapshot
          path: ${{ runner.temp }}/pr59-source.tar.gz
          retention-days: 1
