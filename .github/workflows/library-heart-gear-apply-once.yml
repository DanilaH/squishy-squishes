name: One-time Library shape-specific head gear
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: ['.github/workflows/library-heart-gear-apply-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/library-visual-recovery-sep21
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Guard, patch, build, commit and self-delete
        shell: bash
        run: |
          node scripts/library-heart-gear-apply-once.mjs
          git diff --check
          npm install
          npm run pages:build
          git add src/sandbox/decor.ts src/sandbox/pagesDecorArt.ts src/sandbox/SandboxApp.ts src/sandbox/libraryThumbnail.ts
          git rm scripts/library-heart-gear-apply-once.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(library): seat heart paired gear on lobes and center gear near cleft'
          git push origin HEAD:feat/library-visual-recovery-sep21
