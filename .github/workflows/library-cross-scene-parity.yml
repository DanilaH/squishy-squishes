name: Library cross-scene V3 parity review
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths:
      - 'src/experiments/phaser/libraryVolumeMesh.ts'
      - 'src/sandbox/libraryThumbnail.ts'
      - 'src/experiments/phaser/libraryVolumeProduction.ts'
      - 'src/squish/shaders.ts'
      - 'tests/phaser-pages/library-hall-cross-scene-parity.spec.ts'
      - '.github/workflows/library-cross-scene-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run pages:build
      - name: Real V3 same-toy Studio → Squeeze → Hall comparison
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-cross-scene-parity.spec.ts
      - name: Upload actual 512px Hall and live scene captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-cross-scene-parity
          path: |
            test-results/**/library-hall-parity-*.png
            test-results/**/library-hall-parity-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-parity-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
