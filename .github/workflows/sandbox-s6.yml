name: Sandbox S6 Temporary Validation

on:
  push:
    branches:
      - sandbox-pivot-s6-interstitial-lifecycle
    paths:
      - '.github/workflows/sandbox-s6.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s6-interstitial-lifecycle
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full release QA
        run: npm run qa:release
      - name: Check diff
        run: git diff --check
