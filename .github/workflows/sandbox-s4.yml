name: Sandbox S4 Temporary Implementation

on:
  push:
    branches:
      - sandbox-pivot-s4-ideas-titles
    paths:
      - '.github/workflows/sandbox-s4.yml'
      - 'scripts/apply-sandbox-s4.mjs'
      - 'scripts/fix-sandbox-s4-exact-optional.mjs'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s4-ideas-titles
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply S4 patch
        run: |
          node scripts/apply-sandbox-s4.mjs
          node scripts/fix-sandbox-s4-exact-optional.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build Pages
        run: npm run build
      - name: Check diff
        run: git diff --check
      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No implementation diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs/IMPLEMENTATION_ROADMAP.md
          git commit -m "Build Sandbox S4 Ideas and titles"
          git push
