name: Sandbox S2 Temporary Modal Fix

on:
  push:
    branches:
      - sandbox-pivot-s2-library

permissions:
  contents: write

jobs:
  validate:
    if: startsWith(github.event.head_commit.message, 'Arm S2 modal visual fix')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s2-library
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply bounded modal fix
        run: node scripts/apply-sandbox-s2-modal-fix.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:release
      - name: Capture production library lifecycle after modal fix
        run: npx playwright test tests/release/s2-visual.spec.ts --config=playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-s2-modal-fix-visuals
          path: s2-visuals
          if-no-files-found: error
      - name: Commit validated S2 modal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox-library.css
          git diff --cached --check
          git commit -m "Fix Sandbox S2 modal readability"
          git push origin HEAD:sandbox-pivot-s2-library
