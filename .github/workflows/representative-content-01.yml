name: Representative Content 01

on:
  push:
    branches:
      - representative-content-01

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: representative-content-01
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/apply_representative_content_01.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Implement representative material and filling content
          file_pattern: src/squish/SquishSurface.ts src/game/VerticalSliceApp.ts src/i18n/en.ts src/i18n/ru.ts docs/IMPLEMENTATION_ROADMAP.md docs/CONTENT_AND_PROGRESSION.md docs/REPRESENTATIVE_CONTENT_01.md
