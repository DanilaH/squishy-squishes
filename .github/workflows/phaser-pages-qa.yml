name: Phaser Pages QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pages-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox
      - name: Build and smoke-test staged Pages tree in both browsers
        run: npm run pages:qa
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-pages-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
