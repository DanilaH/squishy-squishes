name: Material Visual QA

on:
  push:
    branches:
      - sandbox-polish-materials-02

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Capture materials
        run: npx playwright test tests/release/materials-visual.tmp.spec.ts --config=playwright.release.config.ts
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materials-visual
          path: artifacts/
          if-no-files-found: error
