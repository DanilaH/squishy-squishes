name: Release Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  release-check:
    outputs:
      build-artifact-id: ${{ steps.shared-build.outputs.artifact-id }}
      docs-only: ${{ steps.scope.outputs.docs-only }}
      qa-reused: ${{ steps.verify-pr.outputs.qa-reused }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Classify documentation-only changes conservatively
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-change-scope.mjs
      - name: Verify change-scope rules
        run: node --test tests/tooling/ci-change-scope.test.mjs
      - name: Setup Node
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Find successful merged PR evidence
        id: merged-pr
        if: steps.scope.outputs.docs-only != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-reuse.mjs find
      - name: Download candidate immutable PR build
        if: steps.merged-pr.outputs.artifact-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.merged-pr.outputs.artifact-id }}
          run-id: ${{ steps.merged-pr.outputs.run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ci-build
      - name: Verify exact source tree, provenance and archive checksum
        id: verify-pr
        if: steps.scope.outputs.docs-only != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-release-reuse.mjs verify
      - name: Install dependencies
        if: steps.scope.outputs.docs-only != 'true' && steps.verify-pr.outputs.qa-reused != 'true'
        run: npm ci
      - name: Validate Pages and Yandex builds
        if: steps.scope.outputs.docs-only != 'true' && steps.verify-pr.outputs.qa-reused != 'true'
        run: npm run release:check
      - name: Build and stage the isolated Pages preview once
        if: steps.scope.outputs.docs-only != 'true' && steps.verify-pr.outputs.qa-reused != 'true'
        run: npm run pages:build:app
      - name: Package shared build with source identity and checksum
        if: steps.scope.outputs.docs-only != 'true' && steps.verify-pr.outputs.qa-reused != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-build
          tar -czf ci-build/release-build.tar.gz dist dist-yandex
          printf '%s\n' "$GITHUB_SHA" > ci-build/source-sha
          git rev-parse 'HEAD^{tree}' > ci-build/source-tree
          (cd ci-build && sha256sum release-build.tar.gz > SHA256SUMS)
      - name: Upload the exact build for QA and deployment
        id: shared-build
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ github.run_attempt }}
          path: ci-build/*
          if-no-files-found: error
          retention-days: 7
      - name: Restore the already tested roots when reusing PR QA
        if: steps.verify-pr.outputs.qa-reused == 'true'
        run: tar -xzf ci-build/release-build.tar.gz
      - name: Package Yandex archive
        if: steps.scope.outputs.docs-only != 'true'
        run: |
          cd dist-yandex
          zip -r ../squishy-squishes-yandex.zip .
      - name: Upload Yandex archive
        if: steps.scope.outputs.docs-only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: squishy-squishes-yandex
          overwrite: true
          path: squishy-squishes-yandex.zip
          if-no-files-found: error

  browser-qa-shard:
    needs: release-check
    if: needs.release-check.outputs.docs-only != 'true' && needs.release-check.outputs.qa-reused != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download this run's shared build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-check.outputs.build-artifact-id }}
          merge-multiple: true
          path: ci-build
      - name: Verify source identity and restore the exact build
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ci-build/source-sha)" = "$GITHUB_SHA"
          (cd ci-build && sha256sum --check SHA256SUMS)
          tar -xzf ci-build/release-build.tar.gz
          test -f dist/index.html
          test -f dist/phaser/index.html
          test -f dist-yandex/index.html
      - name: Run release browser QA
        run: npm run qa:browser -- --shard=${{ matrix.shard }}/4
      - name: Upload passing migration baseline evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phaser-m0-old-engine-evidence-${{ matrix.shard }}
          overwrite: true
          path: migration-baseline-evidence/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-qa-failure-${{ matrix.shard }}
          overwrite: true
          path: |
            playwright-report
            test-results
            migration-baseline-evidence
          if-no-files-found: ignore
          retention-days: 14

  visual-qa:
    needs: release-check
    if: needs.release-check.outputs.docs-only != 'true' && needs.release-check.outputs.qa-reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download this run's shared build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-check.outputs.build-artifact-id }}
          merge-multiple: true
          path: ci-build
      - name: Verify source identity and restore the exact build
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ci-build/source-sha)" = "$GITHUB_SHA"
          (cd ci-build && sha256sum --check SHA256SUMS)
          tar -xzf ci-build/release-build.tar.gz
          test -f dist/index.html
          test -f dist/phaser/index.html
          test -f dist-yandex/index.html
      - name: Compare production UI with reviewed visual baselines
        run: npm run qa:visual
      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-visual-qa-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

  browser-qa:
    needs: [release-check, browser-qa-shard, visual-qa]
    if: always() && needs.release-check.outputs.qa-reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all browser shards and visual comparisons
        env:
          BUILD_RESULT: ${{ needs.release-check.result }}
          DOCS_ONLY: ${{ needs.release-check.outputs.docs-only }}
          VISUAL_RESULT: ${{ needs.visual-qa.result }}
          SHARDS_RESULT: ${{ needs.browser-qa-shard.result }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$DOCS_ONLY" != true ]; then
            test "$SHARDS_RESULT" = success && test "$VISUAL_RESULT" = success
          fi

  pages-preview-shard:
    needs: release-check
    if: needs.release-check.outputs.docs-only != 'true' && needs.release-check.outputs.qa-reused != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download this run's shared build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-check.outputs.build-artifact-id }}
          merge-multiple: true
          path: ci-build
      - name: Verify source identity and restore the exact build
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ci-build/source-sha)" = "$GITHUB_SHA"
          (cd ci-build && sha256sum --check SHA256SUMS)
          tar -xzf ci-build/release-build.tar.gz
          test -f dist/index.html
          test -f dist/phaser/index.html
          test -f dist-yandex/index.html
      - name: Test the shared staged Pages tree, including touch gestures
        run: npx playwright test --config=playwright.phaser-pages.config.ts --shard=${{ matrix.shard }}/4
      - name: Upload Shape and Finish visual review snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-candy-ui-screenshots-${{ matrix.shard }}
          overwrite: true
          path: test-results/**/candy-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-pages-failure-${{ matrix.shard }}
          overwrite: true
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  # Keep the reviewed gate name for required checks and exact-PR reuse proof.
  # A successful full-QA aggregate requires every isolated runner to pass.
  pages-preview:
    needs: [release-check, pages-preview-shard]
    if: >-
      !cancelled() && needs.release-check.outputs.qa-reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every Pages shard to pass
        env:
          BUILD_RESULT: ${{ needs.release-check.result }}
          DOCS_ONLY: ${{ needs.release-check.outputs.docs-only }}
          PAGES_SHARDS_RESULT: ${{ needs.pages-preview-shard.result }}
        run: |
          test "$BUILD_RESULT" = success
          if [ "$DOCS_ONLY" != true ]; then test "$PAGES_SHARDS_RESULT" = success; fi

  build-and-deploy:
    needs: [release-check, browser-qa, pages-preview]
    if: >-
      !cancelled() && needs.release-check.outputs.docs-only != 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.release-check.result == 'success' &&
      ((needs.release-check.outputs.qa-reused == 'true' &&
        needs.browser-qa.result == 'skipped' && needs.pages-preview.result == 'skipped') ||
       (needs.browser-qa.result == 'success' && needs.pages-preview.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v5
      - name: Download this run's shared build
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-check.outputs.build-artifact-id }}
          merge-multiple: true
          path: ci-build
      - name: Verify source identity and restore the exact build
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat ci-build/source-sha)" = "$GITHUB_SHA"
          (cd ci-build && sha256sum --check SHA256SUMS)
          tar -xzf ci-build/release-build.tar.gz
          test -f dist/index.html
          test -f dist/phaser/index.html
          test -f dist-yandex/index.html
      - name: Publish the verified tree only while its source is current main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipping stale deployment; main has advanced."
            exit 0
          fi
          publish_dir="$(mktemp -d "$RUNNER_TEMP/squishy-pages.XXXXXX")"
          cp -a dist/. "$publish_dir/"
          git -C "$publish_dir" init --initial-branch=gh-pages
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" add -A
          git -C "$publish_dir" commit -m "Deploy ${GITHUB_SHA}"
          git fetch "$publish_dir" gh-pages
          git push origin FETCH_HEAD:refs/heads/gh-pages --force
          echo "published=true" >> "$GITHUB_OUTPUT"

  hosted-smoke:
    needs: [release-check, build-and-deploy]
    if: >-
      !cancelled() && needs.build-and-deploy.result == 'success' &&
      needs.build-and-deploy.outputs.published == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-check.outputs.build-artifact-id }}
          merge-multiple: true
          path: ci-build
      - name: Restore verified build for live asset comparison
        run: |
          test "$(cat ci-build/source-sha)" = "$GITHUB_SHA"
          (cd ci-build && sha256sum --check SHA256SUMS)
          tar -xzf ci-build/release-build.tar.gz
      - name: Wait for Pages to serve these exact tested bytes
        run: node scripts/ci-wait-for-pages.mjs
      - name: Exercise hosted touch editing, save and reload
        run: npx playwright test --config=playwright.hosted.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-release-evidence
          path: |
            hosted-source.json
            ci-build/verified-pr.json
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
