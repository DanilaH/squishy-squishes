name: Sandbox S4 Temporary Visual Review

on:
  push:
    branches:
      - sandbox-pivot-s4-ideas-titles
    paths:
      - '.github/workflows/sandbox-s4-visual.yml'
      - 'tests/release/s4-visual.spec.ts'

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s4-ideas-titles
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Pages
        run: npm run build
      - name: Capture visual states
        run: npx playwright test tests/release/s4-visual.spec.ts --config=playwright.release.config.ts
      - name: Commit visual evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/s4-visual
          if git diff --cached --quiet; then
            echo "No visual evidence produced"
            exit 1
          fi
          git commit -m "Capture Sandbox S4 visual evidence"
          git push
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-s4-visual-failure
          path: |
            playwright-report
            test-results
            artifacts/s4-visual
          if-no-files-found: ignore
          retention-days: 14

# Retry armed after validated locator fix.
