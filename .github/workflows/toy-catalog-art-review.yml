name: Toy catalog art review
on:
  push:
    branches: [qa/toy-catalog-art-review]
    paths: [.github/workflows/toy-catalog-art-review.yml]
permissions:
  contents: read
jobs:
  art-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Capture proposed baselines for manual review only
        run: npm run qa:visual:update
      - name: Run production browser checks and unmasked catalog captures
        run: npm run qa:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toy-catalog-art-review
          path: |
            tests/visual/*-snapshots
            migration-baseline-evidence
            test-results
            playwright-report
          retention-days: 14
