name: Release Browser QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and run release browser QA
        run: npm run qa:release
      - name: Upload passing migration baseline evidence
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phaser-m0-old-engine-evidence
          path: migration-baseline-evidence/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-browser-qa-failure
          path: |
            playwright-report
            test-results
            migration-baseline-evidence
          if-no-files-found: ignore
          retention-days: 14
