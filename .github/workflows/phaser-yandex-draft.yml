name: Phaser Yandex DRAFT

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-change-scope.mjs
  phaser-yandex-draft-tests:
    needs: change-scope
    if: needs.change-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Audit exact DRAFT bundle and exercise compiled index
        run: npm run draft:qa
      - name: Package verified Phaser DRAFT root
        run: |
          cd dist-phaser-yandex
          zip -r ../squishy-squishes-phaser-draft.zip .
          cd ..
          sha256sum squishy-squishes-phaser-draft.zip
      - name: Upload verified Phaser DRAFT archive
        uses: actions/upload-artifact@v4
        with:
          name: squishy-squishes-phaser-draft
          path: squishy-squishes-phaser-draft.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-yandex-draft-failure
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14

  phaser-yandex-draft:
    needs: [change-scope, phaser-yandex-draft-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the DRAFT audit or a confirmed documentation-only change
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          DOCS_ONLY: ${{ needs.change-scope.outputs.docs-only }}
          DRAFT_RESULT: ${{ needs.phaser-yandex-draft-tests.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$DOCS_ONLY" != true ]; then test "$DRAFT_RESULT" = success; fi
