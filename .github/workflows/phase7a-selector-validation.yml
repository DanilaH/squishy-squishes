name: Phase 7A Selector Validation

on:
  push:
    branches:
      - phase-7a-mochi-peach
    paths:
      - .github/workflows/phase7a-selector-validation.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-7a-mochi-peach
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply selector patch
        run: node scripts/phase7a-selector-patch.mjs
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts
          git commit -m "Isolate Phase 7A shapes from legacy selector"
          git push origin HEAD:phase-7a-mochi-peach
