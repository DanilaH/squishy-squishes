name: Sandbox S0 Appearance Probe Apply

on:
  push:
    branches:
      - sandbox-pivot-s0-appearance-probe

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Arm S0 appearance probe renderer')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s0-appearance-probe
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply renderer seam and probe bootstrap
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replaceOnce = (source, from, to, label) => {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one anchor, found ${count}`);
            return source.replace(from, to);
          };

          const surfacePath = 'src/squish/SquishSurface.ts';
          let surface = fs.readFileSync(surfacePath, 'utf8');
          surface = replaceOnce(
            surface,
            `  private readonly shapeTexture: WebGLTexture;\n  private readonly shapeFieldUniform: WebGLUniformLocation;`,
            `  private readonly shapeTexture: WebGLTexture;\n  private readonly appearanceTexture: WebGLTexture;\n  private readonly shapeFieldUniform: WebGLUniformLocation;\n  private readonly appearanceTextureUniform: WebGLUniformLocation;\n  private readonly appearanceEnabledUniform: WebGLUniformLocation;`,
            'appearance texture fields',
          );
          surface = replaceOnce(
            surface,
            `  private moldProgress = 0;\n  private animationFrame = 0;`,
            `  private moldProgress = 0;\n  private appearanceEnabled = false;\n  private animationFrame = 0;`,
            'appearance enabled state',
          );
          surface = replaceOnce(
            surface,
            `    this.shapeFieldUniform = requireUniform(gl, this.program, 'uShapeField');\n    this.pointerUvUniform = requireUniform(gl, this.program, 'uPointerUv');`,
            `    this.shapeFieldUniform = requireUniform(gl, this.program, 'uShapeField');\n    this.appearanceTextureUniform = requireUniform(gl, this.program, 'uAppearanceTexture');\n    this.appearanceEnabledUniform = requireUniform(gl, this.program, 'uAppearanceEnabled');\n    this.pointerUvUniform = requireUniform(gl, this.program, 'uPointerUv');`,
            'appearance uniforms',
          );
          surface = replaceOnce(
            surface,
            `    const shapeTexture = gl.createTexture();\n    if (!vao || !vertexBuffer || !triangleIndexBuffer || !lineIndexBuffer || !shapeTexture) {\n      throw new Error('Unable to allocate WebGL buffers or shape texture.');\n    }`,
            `    const shapeTexture = gl.createTexture();\n    const appearanceTexture = gl.createTexture();\n    if (!vao || !vertexBuffer || !triangleIndexBuffer || !lineIndexBuffer || !shapeTexture || !appearanceTexture) {\n      throw new Error('Unable to allocate WebGL buffers or textures.');\n    }`,
            'appearance texture allocation',
          );
          surface = replaceOnce(
            surface,
            `    this.shapeTexture = shapeTexture;\n\n    gl.activeTexture(gl.TEXTURE0);`,
            `    this.shapeTexture = shapeTexture;\n    this.appearanceTexture = appearanceTexture;\n\n    gl.activeTexture(gl.TEXTURE0);`,
            'appearance texture assignment',
          );
          surface = replaceOnce(
            surface,
            `    this.uploadShapeField(this.shape);\n    gl.bindTexture(gl.TEXTURE_2D, null);\n\n    const triangleIndices: number[] = [];`,
            `    this.uploadShapeField(this.shape);\n    gl.bindTexture(gl.TEXTURE_2D, null);\n\n    gl.activeTexture(gl.TEXTURE1);\n    gl.bindTexture(gl.TEXTURE_2D, this.appearanceTexture);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);\n    gl.texImage2D(\n      gl.TEXTURE_2D,\n      0,\n      gl.RGBA,\n      1,\n      1,\n      0,\n      gl.RGBA,\n      gl.UNSIGNED_BYTE,\n      new Uint8Array([0, 0, 0, 0]),\n    );\n    gl.bindTexture(gl.TEXTURE_2D, null);\n    gl.activeTexture(gl.TEXTURE0);\n\n    const triangleIndices: number[] = [];`,
            'appearance texture initialization',
          );
          surface = replaceOnce(
            surface,
            `  public setMoldProgress(progress: number): void {\n    this.moldProgress = clamp01(progress);\n  }\n\n  public primeAudio(): Promise<void> {`,
            `  public setMoldProgress(progress: number): void {\n    this.moldProgress = clamp01(progress);\n  }\n\n  public setAppearanceTexture(source: TexImageSource | null): void {\n    const gl = this.gl;\n    gl.activeTexture(gl.TEXTURE1);\n    gl.bindTexture(gl.TEXTURE_2D, this.appearanceTexture);\n\n    if (source === null) {\n      gl.texImage2D(\n        gl.TEXTURE_2D,\n        0,\n        gl.RGBA,\n        1,\n        1,\n        0,\n        gl.RGBA,\n        gl.UNSIGNED_BYTE,\n        new Uint8Array([0, 0, 0, 0]),\n      );\n      this.appearanceEnabled = false;\n    } else {\n      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 1);\n      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);\n      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 0);\n      this.appearanceEnabled = true;\n    }\n\n    gl.bindTexture(gl.TEXTURE_2D, null);\n    gl.activeTexture(gl.TEXTURE0);\n  }\n\n  public clientPointToUv(clientX: number, clientY: number): { u: number; v: number } | null {\n    const local = this.clientPointToLocal(clientX, clientY);\n    if (!this.isInsideObject(local.x, local.y)) return null;\n    return {\n      u: clamp01(local.x * 0.5 + 0.5),\n      v: clamp01(local.y * 0.5 + 0.5),\n    };\n  }\n\n  public primeAudio(): Promise<void> {`,
            'appearance public API',
          );
          surface = replaceOnce(
            surface,
            `    this.gl.deleteTexture(this.shapeTexture);\n    this.gl.deleteVertexArray(this.vao);`,
            `    this.gl.deleteTexture(this.shapeTexture);\n    this.gl.deleteTexture(this.appearanceTexture);\n    this.gl.deleteVertexArray(this.vao);`,
            'appearance texture disposal',
          );
          surface = replaceOnce(
            surface,
            `  private pointerToLocal(event: PointerEvent): { x: number; y: number } {\n    const rect = this.canvas.getBoundingClientRect();\n    const ndcX = ((event.clientX - rect.left) / Math.max(1, rect.width)) * 2 - 1;\n    const ndcY = 1 - ((event.clientY - rect.top) / Math.max(1, rect.height)) * 2;\n    return {\n      x: ndcX / Math.max(0.0001, this.scaleX),\n      y: ndcY / Math.max(0.0001, this.scaleY),\n    };\n  }`,
            `  private pointerToLocal(event: PointerEvent): { x: number; y: number } {\n    return this.clientPointToLocal(event.clientX, event.clientY);\n  }\n\n  private clientPointToLocal(clientX: number, clientY: number): { x: number; y: number } {\n    const rect = this.canvas.getBoundingClientRect();\n    const ndcX = ((clientX - rect.left) / Math.max(1, rect.width)) * 2 - 1;\n    const ndcY = 1 - ((clientY - rect.top) / Math.max(1, rect.height)) * 2;\n    return {\n      x: ndcX / Math.max(0.0001, this.scaleX),\n      y: ndcY / Math.max(0.0001, this.scaleY),\n    };\n  }`,
            'client point conversion',
          );
          surface = replaceOnce(
            surface,
            `    gl.activeTexture(gl.TEXTURE0);\n    gl.bindTexture(gl.TEXTURE_2D, this.shapeTexture);\n    gl.uniform1i(this.shapeFieldUniform, 0);\n    gl.uniform2f(this.scaleUniform, this.scaleX, this.scaleY);`,
            `    gl.activeTexture(gl.TEXTURE0);\n    gl.bindTexture(gl.TEXTURE_2D, this.shapeTexture);\n    gl.uniform1i(this.shapeFieldUniform, 0);\n    gl.activeTexture(gl.TEXTURE1);\n    gl.bindTexture(gl.TEXTURE_2D, this.appearanceTexture);\n    gl.uniform1i(this.appearanceTextureUniform, 1);\n    gl.uniform1i(this.appearanceEnabledUniform, this.appearanceEnabled ? 1 : 0);\n    gl.activeTexture(gl.TEXTURE0);\n    gl.uniform2f(this.scaleUniform, this.scaleX, this.scaleY);`,
            'appearance render binding',
          );
          fs.writeFileSync(surfacePath, surface);

          const shaderPath = 'src/squish/shaders.ts';
          let shader = fs.readFileSync(shaderPath, 'utf8');
          shader = replaceOnce(
            shader,
            `uniform sampler2D uShapeField;\nuniform vec2 uPointerUv;`,
            `uniform sampler2D uShapeField;\nuniform sampler2D uAppearanceTexture;\nuniform bool uAppearanceEnabled;\nuniform vec2 uPointerUv;`,
            'appearance shader uniforms',
          );
          shader = replaceOnce(
            shader,
            `  float vertical = smoothstep(0.0, 1.0, vUv.y);\n  vec3 base = mix(uColorLow, uColorHigh, vertical);\n\n  float edge = smoothstep(0.5, 1.0, shape);`,
            `  float vertical = smoothstep(0.0, 1.0, vUv.y);\n  vec3 base = mix(uColorLow, uColorHigh, vertical);\n  if (uAppearanceEnabled) {\n    vec4 appearance = texture(uAppearanceTexture, vUv);\n    base = mix(base, appearance.rgb, clamp(appearance.a, 0.0, 1.0));\n  }\n\n  float edge = smoothstep(0.5, 1.0, shape);`,
            'appearance shader sample',
          );
          fs.writeFileSync(shaderPath, shader);

          const bootstrapPath = 'src/app/bootstrap.ts';
          let bootstrap = fs.readFileSync(bootstrapPath, 'utf8');
          bootstrap = replaceOnce(
            bootstrap,
            `  document.body.dataset.releasePlatform = runtime.kind;\n  document.body.dataset.releaseBuild = import.meta.env.PROD ? 'production' : 'development';\n  const saveRepository = createSaveRepository(runtime.storage);`,
            `  document.body.dataset.releasePlatform = runtime.kind;\n  document.body.dataset.releaseBuild = import.meta.env.PROD ? 'production' : 'development';\n\n  if (\n    import.meta.env.VITE_PLATFORM !== 'yandex'\n    && new URLSearchParams(window.location.search).get('appearanceProbe') === '1'\n  ) {\n    const { installAppearanceProbe } = await import('../debug/installAppearanceProbe');\n    const removeAppearanceProbe = await installAppearanceProbe(root, runtime.storage);\n    runtime.activity.setGameplayDesired(true);\n    runtime.markReady();\n    let probeDisposed = false;\n    return {\n      async dispose() {\n        if (probeDisposed) return;\n        probeDisposed = true;\n        runtime.activity.setGameplayDesired(false);\n        removeAppearanceProbe();\n        runtime.destroy();\n      },\n    };\n  }\n\n  const saveRepository = createSaveRepository(runtime.storage);`,
            'appearance probe bootstrap',
          );
          fs.writeFileSync(bootstrapPath, bootstrap);

          const probePath = 'src/debug/installAppearanceProbe.ts';
          let probe = fs.readFileSync(probePath, 'utf8');
          probe = replaceOnce(
            probe,
            `    shell.dataset.probeBudget = bytes <= SAVE_BUDGET_BYTES ? 'pass' : 'fail';\n    stats.textContent =`,
            `    shell.dataset.probeBudget = bytes <= SAVE_BUDGET_BYTES ? 'pass' : 'fail';\n    shell.dataset.probeSqueezes = String(latestMetrics.squeezes);\n    stats.textContent =`,
            'probe squeeze metric',
          );
          probe = replaceOnce(
            probe,
            `  replayDocument(paintContext, documentState);\n  if (documentState.strokes.length > 0) surface.setAppearanceTexture(paintCanvas);`,
            `  replayDocument(paintContext, documentState);\n  shell.dataset.probeLoaded = 'true';\n  if (documentState.strokes.length > 0) surface.setAppearanceTexture(paintCanvas);`,
            'probe loaded marker',
          );
          fs.writeFileSync(probePath, probe);

          const verifierPath = 'scripts/verify-yandex-dist.mjs';
          let verifier = fs.readFileSync(verifierPath, 'utf8');
          verifier = replaceOnce(
            verifier,
            `let qaMarkerFound = false;`,
            `let qaMarkerFound = false;\nlet appearanceProbeMarkerFound = false;`,
            'probe verifier state',
          );
          verifier = replaceOnce(
            verifier,
            `  if (text.includes('squishy.phone-qa.open.v1')) qaMarkerFound = true;`,
            `  if (text.includes('squishy.phone-qa.open.v1')) qaMarkerFound = true;\n  if (text.includes('squishy.appearance-probe.v1')) appearanceProbeMarkerFound = true;`,
            'probe verifier marker scan',
          );
          verifier = replaceOnce(
            verifier,
            `if (qaMarkerFound) throw new Error('Phone QA code leaked into the Yandex release bundle');`,
            `if (qaMarkerFound) throw new Error('Phone QA code leaked into the Yandex release bundle');\nif (appearanceProbeMarkerFound) throw new Error('Appearance probe code leaked into the Yandex release bundle');`,
            'probe verifier assertion',
          );
          fs.writeFileSync(verifierPath, verifier);
          NODE
      - name: Add temporary S0 browser proof
        run: |
          mkdir -p s0-artifacts
          cat > tests/release/appearance-probe.s0.spec.ts <<'TEST'
          import { expect, test, type Page } from '@playwright/test';

          const PAGES_URL = '/squishy-squishes/?appearanceProbe=1';

          const drawStroke = async (page: Page, points: readonly [number, number][]): Promise<void> => {
            const first = points[0];
            if (!first) throw new Error('stroke needs at least one point');
            await page.mouse.move(first[0], first[1]);
            await page.mouse.down();
            for (const [x, y] of points.slice(1)) await page.mouse.move(x, y, { steps: 4 });
            await page.mouse.up();
          };

          test('S0 custom appearance paints, saves, reloads and deforms under real pointer input', async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            const fatal: string[] = [];
            page.on('pageerror', (error) => fatal.push(error.message));
            page.on('requestfailed', (request) => fatal.push(`${request.method()} ${request.url()} ${request.failure()?.errorText ?? ''}`));

            await page.goto(PAGES_URL);
            const shell = page.locator('[data-appearance-probe]');
            await expect(shell).toBeVisible();
            await expect(shell).toHaveAttribute('data-probe-loaded', 'true');

            const canvas = page.locator('[data-probe-canvas]');
            const box = await canvas.boundingBox();
            expect(box).not.toBeNull();
            if (!box) return;
            const cx = box.x + box.width / 2;
            const cy = box.y + box.height / 2;

            await drawStroke(page, [[cx - 62, cy - 18], [cx - 24, cy - 8], [cx + 18, cy + 4], [cx + 58, cy + 12]]);
            await page.locator('[data-probe-tool="color-b"]').click();
            await drawStroke(page, [[cx - 8, cy - 62], [cx - 2, cy - 22], [cx + 4, cy + 18], [cx + 12, cy + 60]]);
            await page.locator('[data-probe-tool="erase"]').click();
            await page.locator('[data-probe-size="18"]').click();
            await drawStroke(page, [[cx + 12, cy - 8], [cx + 30, cy + 6], [cx + 44, cy + 18]]);

            await expect(shell).toHaveAttribute('data-probe-strokes', '3');
            await expect(shell).toHaveAttribute('data-probe-budget', 'pass');
            const bytes = Number(await shell.getAttribute('data-probe-bytes'));
            expect(bytes).toBeGreaterThan(0);
            expect(bytes).toBeLessThanOrEqual(6000);

            await page.locator('[data-probe-action="save"]').click();
            await expect(shell).toHaveAttribute('data-probe-saved', 'true');
            await page.screenshot({ path: 's0-artifacts/appearance-probe-painted.png', fullPage: true });

            await page.reload();
            const reloadedShell = page.locator('[data-appearance-probe]');
            await expect(reloadedShell).toHaveAttribute('data-probe-loaded', 'true');
            await expect(reloadedShell).toHaveAttribute('data-probe-strokes', '3');
            await expect(reloadedShell).toHaveAttribute('data-probe-budget', 'pass');
            await page.screenshot({ path: 's0-artifacts/appearance-probe-reloaded.png', fullPage: true });

            await page.locator('[data-probe-mode="squeeze"]').click();
            const reloadedBox = await page.locator('[data-probe-canvas]').boundingBox();
            expect(reloadedBox).not.toBeNull();
            if (!reloadedBox) return;
            const sx = reloadedBox.x + reloadedBox.width / 2;
            const sy = reloadedBox.y + reloadedBox.height / 2;
            await page.mouse.move(sx, sy);
            await page.mouse.down();
            await page.mouse.move(sx + reloadedBox.width * 0.18, sy + reloadedBox.height * 0.05, { steps: 10 });
            await page.mouse.up();
            await expect.poll(async () => Number(await reloadedShell.getAttribute('data-probe-squeezes'))).toBeGreaterThan(0);
            await page.waitForTimeout(350);
            await page.screenshot({ path: 's0-artifacts/appearance-probe-after-squeeze.png', fullPage: true });

            expect(fatal).toEqual([]);
          });
          TEST
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate release and S0 browser proof
        run: npm run qa:release
      - name: Upload S0 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-s0-appearance-screens
          path: s0-artifacts
          if-no-files-found: ignore
      - name: Commit validated S0 renderer seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/squish/SquishSurface.ts src/squish/shaders.ts src/app/bootstrap.ts src/debug/installAppearanceProbe.ts scripts/verify-yandex-dist.mjs
          git diff --cached --check
          git commit -m "Add S0 custom appearance renderer seam"
          git push origin HEAD:sandbox-pivot-s0-appearance-probe
