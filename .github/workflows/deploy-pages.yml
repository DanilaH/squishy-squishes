name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Build and browser-test original Pages game plus isolated Phaser preview
        run: npm run pages:qa

      - name: Publish dist to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/phaser/index.html
          rm -rf /tmp/squishy-pages
          mkdir -p /tmp/squishy-pages
          cp -a dist/. /tmp/squishy-pages/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf --ignore-unmatch .
          git clean -fdx
          cp -a /tmp/squishy-pages/. .
          touch .nojekyll
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force origin gh-pages
