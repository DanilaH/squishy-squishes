name: UI UX Pass 01 Validation

on:
  push:
    branches:
      - ui-ux-pass-01

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-pass-01
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply UI UX source patch
        run: |
          node scripts/apply-ui-ux-pass-01.mjs
          node scripts/fix-ui-ux-pass-01-css.mjs
      - name: Diff check
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Validate Pages and Yandex builds
        run: npm run release:check
      - name: Commit validated source and remove temporary tooling
        run: |
          rm scripts/apply-ui-ux-pass-01.mjs
          rm scripts/fix-ui-ux-pass-01-css.mjs
          rm .github/workflows/ui-ux-pass-01-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/ui-ux-pass-01.css scripts .github/workflows/ui-ux-pass-01-validation.yml
          git commit -m "Implement recipe-first UI UX pass"
          git push origin HEAD:ui-ux-pass-01
