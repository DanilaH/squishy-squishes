name: Sandbox S5 Temporary Visual Review

on:
  push:
    branches:
      - sandbox-pivot-s5-rewarded-shelf
    paths:
      - '.github/workflows/sandbox-s5-visual.yml'
      - 'tests/release/s5-visual.spec.ts'

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s5-rewarded-shelf
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Pages and Yandex
        run: |
          npm run build
          npm run build:yandex
      - name: Capture S5 visual states
        run: npx playwright test tests/release/s5-visual.spec.ts --config=playwright.release.config.ts
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-s5-visuals
          path: artifacts/s5-visual
          if-no-files-found: error
          retention-days: 7
