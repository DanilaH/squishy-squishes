name: Apply Material Compile Fix

on:
  push:
    branches:
      - sandbox-polish-materials-02

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Wire new material fields through legacy surfaces'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch compile surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/game/VerticalSliceApp.ts',
              '''      translucency: material.translucency,\n      iridescence: material.iridescence,\n    });''',
              '''      translucency: material.translucency,\n      iridescence: material.iridescence,\n      roughness: material.roughness,\n      metallic: material.metallic,\n      pearlescence: material.pearlescence,\n      cloudiness: material.cloudiness,\n    });''',
          )

          replace_once(
              'src/sandbox/SandboxLibraryApp.ts',
              '''const RU_MATERIALS: Readonly<Record<SavedSquishy['materialId'], string>> = {\n  soft: 'Мягкий',\n  jelly: 'Желе',\n  holo: 'Голографик',\n};\n\nconst EN_MATERIALS: Readonly<Record<SavedSquishy['materialId'], string>> = {\n  soft: 'Soft',\n  jelly: 'Jelly',\n  holo: 'Holo',\n};''',
              '''const RU_MATERIALS: Readonly<Record<SavedSquishy['materialId'], string>> = {\n  soft: 'Мягкий',\n  jelly: 'Желе',\n  holo: 'Голографик',\n  marshmallow: 'Маршмеллоу',\n  pearl: 'Перламутр',\n  chrome: 'Хром',\n};\n\nconst EN_MATERIALS: Readonly<Record<SavedSquishy['materialId'], string>> = {\n  soft: 'Soft',\n  jelly: 'Jelly',\n  holo: 'Holo',\n  marshmallow: 'Marshmallow',\n  pearl: 'Pearl',\n  chrome: 'Chrome',\n};''',
          )

          replace_once(
              'src/sandbox/ideas.ts',
              '''const RU_MATERIALS: Readonly<Record<MaterialId, string>> = {\n  soft: 'Мягкий',\n  jelly: 'Желе',\n  holo: 'Голографик',\n};''',
              '''const RU_MATERIALS: Readonly<Record<MaterialId, string>> = {\n  soft: 'Мягкий',\n  jelly: 'Желе',\n  holo: 'Голографик',\n  marshmallow: 'Маршмеллоу',\n  pearl: 'Перламутр',\n  chrome: 'Хром',\n};''',
          )
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/sandbox/SandboxLibraryApp.ts src/sandbox/ideas.ts
          git commit -m "Wire new material fields through legacy surfaces"
          git push origin HEAD:sandbox-polish-materials-02
