name: Hosted Decor corrections verification
on:
  push:
    branches: [qa/hosted-decor-fixes-2026-10-02]
    paths: [.github/workflows/hosted-decor-verification.yml]
permissions:
  contents: read
jobs:
  hosted-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify actual published release assets
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const response = await fetch('https://danilah.github.io/squishy-squishes/', { cache: 'no-store' });
          assert.equal(response.status, 200);
          const html = await response.text();
          assert.ok(html.includes('index-BT3Xn9dF.js'), 'Wrong deployed JS');
          assert.ok(html.includes('index-oiTJFUxP.css'), 'Wrong deployed CSS');
          console.log('Published assets match 3382ec4b8a54abec7619582af9c2fd16cf142838');
          JS
      - name: Test live Pages without a local server
        run: |
          cat > playwright.hosted.config.ts <<'TS'
          import config from './playwright.release.config';
          export default {
            ...config,
            retries: 0,
            use: {
              ...config.use,
              baseURL: 'https://danilah.github.io',
              screenshot: 'on' as const,
              launchOptions: { args: ['--enable-webgl', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] },
            },
            webServer: undefined,
          };
          TS
          npx playwright test --config=playwright.hosted.config.ts tests/release/production-cutover.spec.ts tests/release/materials-paint.spec.ts tests/release/toy-polish.spec.ts tests/release/decor-fixes.spec.ts --grep-invert 'production Yandex entry|all mold bows|Decor tabs.*(ru-RU|568|1440)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-decor-corrections-evidence
          path: |
            migration-baseline-evidence
            test-results
            playwright-report
          retention-days: 14
