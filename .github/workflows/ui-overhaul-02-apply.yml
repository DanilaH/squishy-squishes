name: UI Overhaul 02 Apply

on:
  push:
    branches:
      - ui-ux-overhaul-02

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Arm UI Overhaul 02 ownership corrections')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-overhaul-02
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply ownership correction patch
        run: node scripts/apply-ui-overhaul-02c.mjs
      - name: Install and validate
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run build:yandex
          npm run verify:yandex
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/ui-ux-overhaul-02.css src/i18n/en.ts src/i18n/ru.ts
          git diff --cached --check
          git commit -m "Apply UI Overhaul 02 ownership corrections"
          git push origin HEAD:ui-ux-overhaul-02
