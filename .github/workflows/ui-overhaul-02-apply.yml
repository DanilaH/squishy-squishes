name: UI Overhaul 02 Apply

on:
  push:
    branches:
      - ui-ux-overhaul-02

permissions:
  contents: write

jobs:
  apply:
    if: github.sha == '20226f5a90a08fe0ed4ed6f304b22da16dcd1fd8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-overhaul-02
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply source patch
        run: node scripts/apply-ui-overhaul-02.mjs
      - name: Install and validate
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run build:yandex
          npm run verify:yandex
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/ui-ux-overhaul-02.css
          git diff --cached --check
          git commit -m "Apply UI Overhaul 02 source patch"
          git push origin HEAD:ui-ux-overhaul-02
