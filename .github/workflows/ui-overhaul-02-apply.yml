name: UI Overhaul 02 Apply

on:
  push:
    branches:
      - ui-ux-overhaul-02

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Arm UI Overhaul 02 Browser QA patch v2')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-overhaul-02
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply Browser QA contract patch
        run: node scripts/apply-ui-overhaul-02-qa.mjs
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate release and Browser QA
        run: npm run qa:release
      - name: Commit validated QA source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/release.spec.ts
          git diff --cached --check
          git commit -m "Update Browser QA for UI Overhaul 02"
          git push origin HEAD:ui-ux-overhaul-02
