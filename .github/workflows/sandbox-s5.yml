name: Sandbox S5 Temporary Implementation

on:
  push:
    branches:
      - sandbox-pivot-s5-rewarded-shelf
    paths:
      - '.github/workflows/sandbox-s5.yml'
      - 'scripts/apply-sandbox-s5-rewarded.mjs'
      - 'tests/release/s5-rewarded.spec.ts'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s5-rewarded-shelf
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply S5 implementation
        run: node scripts/apply-sandbox-s5-rewarded.mjs
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate release
        run: npm run qa:release
      - name: Check diff
        run: git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxLibraryApp.ts src/app/bootstrap.ts src/sandbox-library.css docs/ANALYTICS_AND_MONETIZATION.md
          git diff --cached --check
          git commit -m "Implement Sandbox S5 rewarded shelf expansion"
          git push
