name: One-time Library heart Pages isolation
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: ['.github/workflows/library-heart-pages-scope-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/library-visual-recovery-sep21
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Scope attachment to Pages and verify build
        shell: bash
        run: |
          node scripts/library-heart-pages-scope-once.mjs
          git diff --check
          npm install
          npm run pages:build
          git add src/sandbox/decor.ts
          git rm scripts/library-heart-pages-scope-once.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(library): limit heart accessory seating to Pages opt-in'
          git push origin HEAD:feat/library-visual-recovery-sep21
