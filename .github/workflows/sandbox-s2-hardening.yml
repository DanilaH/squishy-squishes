name: Sandbox S2 Temporary Hardening

on:
  push:
    branches:
      - sandbox-pivot-s2-library

permissions:
  contents: write

jobs:
  harden:
    if: startsWith(github.event.head_commit.message, 'Arm S2 library hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s2-library
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply S2 security, responsive and QA hardening
        run: node scripts/apply-sandbox-s2-hardening.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:release
      - name: Commit validated S2 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxLibraryApp.ts src/sandbox-library.css tests/release/release.spec.ts
          git diff --cached --check
          git commit -m "Harden Sandbox S2 library"
          git push origin HEAD:sandbox-pivot-s2-library
