name: Sandbox S2 Temporary Hardening

on:
  push:
    branches:
      - sandbox-pivot-s2-library

permissions:
  contents: write

jobs:
  harden:
    if: startsWith(github.event.head_commit.message, 'Arm S2 library hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s2-library
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Harden persisted ids and short landscape empty state
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/sandbox/SandboxLibraryApp.ts')
          s = p.read_text()
          anchor = "const RU_SHAPES: Readonly<Record<SavedSquishy['shapeId'], string>> = {"
          helper = """const escapeAttribute = (value: string): string => value\n  .replaceAll('&', '&amp;')\n  .replaceAll('\\"', '&quot;')\n  .replaceAll('<', '&lt;')\n  .replaceAll('>', '&gt;');\n\n"""
          if anchor not in s:
              raise SystemExit('Library escape anchor missing')
          s = s.replace(anchor, helper + anchor, 1)
          s = s.replace('${toy.id}', '${escapeAttribute(toy.id)}')
          p.write_text(s)

          css = Path('src/sandbox-library.css')
          value = css.read_text()
          value += """

@media (max-height: 520px) and (orientation: landscape) {
  .sandbox-library-empty {
    width: min(100%, 760px);
    margin: 0 auto;
    display: grid;
    grid-template-columns: 140px minmax(0, 1fr);
    grid-template-areas:
      "toy title"
      "toy hint"
      "toy action";
    column-gap: 18px;
    align-items: center;
    text-align: left;
  }
  .sandbox-library-empty__toy { grid-area: toy; width: 130px; margin: 0; font-size: 40px; }
  .sandbox-library-empty h2 { grid-area: title; font-size: 20px; align-self: end; }
  .sandbox-library-empty p { grid-area: hint; margin: 3px 0 7px; font-size: 10px; align-self: center; }
  .sandbox-library-empty .sandbox-library-new--hero { grid-area: action; justify-self: start; min-width: 180px; min-height: 38px; align-self: start; }
}
"""
          css.write_text(value)
          PY
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run qa:release
      - name: Commit validated S2 hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxLibraryApp.ts src/sandbox-library.css
          git diff --cached --check
          git commit -m "Harden Sandbox S2 library"
          git push origin HEAD:sandbox-pivot-s2-library
