name: Sandbox S4 Temporary QA

on:
  push:
    branches:
      - sandbox-pivot-s4-ideas-titles
    paths:
      - '.github/workflows/sandbox-s4-qa.yml'
      - 'scripts/fix-sandbox-s4-test-locators.mjs'
      - 'tests/release/s4-ideas.spec.ts'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s4-ideas-titles
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fix S4 test locators
        run: node scripts/fix-sandbox-s4-test-locators.mjs
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full release QA
        run: npm run qa:release
      - name: Commit validated test fix
        if: success()
        run: |
          if git diff --quiet -- tests/release/s4-ideas.spec.ts tests/release/s4-visual.spec.ts; then
            echo "No test locator diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/s4-ideas.spec.ts tests/release/s4-visual.spec.ts
          git commit -m "Fix Sandbox S4 browser test locators"
          git push
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-s4-qa-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
