name: RC01 Validation

on:
  push:
    branches:
      - release-candidate-01

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: release-candidate-01
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply RC01 source patch
        run: node scripts/apply-rc01.mjs
      - name: Diff check
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Release check
        run: npm run release:check
      - name: Stage validated source
        run: |
          mkdir -p rc01-source/src/app rc01-source/src/platform
          cp src/main.ts rc01-source/src/main.ts
          cp src/app/bootstrap.ts rc01-source/src/app/bootstrap.ts
          cp src/platform/runtime.ts rc01-source/src/platform/runtime.ts
          cp vite.config.ts rc01-source/vite.config.ts
          cp package.json rc01-source/package.json
      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: rc01-validated-source
          path: rc01-source
          if-no-files-found: error
