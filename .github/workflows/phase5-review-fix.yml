name: Fix Phase 5 Review Findings

on:
  push:
    branches:
      - progression-collection-01

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: progression-collection-01
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: python scripts/fix_phase5_review.py
      - run: git diff --check
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Fix Phase 5 independent review findings
          file_pattern: README.md AGENTS.md docs/CONTENT_AND_PROGRESSION.md
