name: UI Overhaul 02 Mobile Actions Fix

on:
  push:
    branches:
      - ui-ux-overhaul-02

permissions:
  contents: write

jobs:
  apply:
    if: startsWith(github.event.head_commit.message, 'Arm mobile completed actions fix')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ui-ux-overhaul-02
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Patch mobile completed actions and QA
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const replaceOnce = (source, from, to, label) => {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`${label}: expected exactly one anchor, found ${count}`);
            return source.replace(from, to);
          };

          const cssPath = 'src/ui-ux-overhaul-02.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          css = replaceOnce(
            css,
            `  .collection-card--completed .collection-card__actions {\n    grid-template-columns: 1fr;\n  }\n\n  .collection-card__action--secondary {\n    display: none;\n  }`,
            `  .collection-card--completed .collection-card__actions {\n    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);\n  }`,
            'mobile completed action layout',
          );
          fs.writeFileSync(cssPath, css);

          const testPath = 'tests/release/release.spec.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = replaceOnce(
            test,
            `  await expect(completedActions).toHaveCount(2);\n  await expect(completedActions.nth(0)).toHaveText('Squeeze');\n  await expect(completedActions.nth(1)).toHaveText('Again');\n\n  expect(fatalErrors).toEqual([]);`,
            `  await expect(completedActions).toHaveCount(2);\n  await expect(completedActions.nth(0)).toHaveText('Squeeze');\n  await expect(completedActions.nth(1)).toHaveText('Again');\n\n  await page.setViewportSize({ width: 390, height: 844 });\n  await expect(completedActions.nth(0)).toBeVisible();\n  await expect(completedActions.nth(1)).toBeVisible();\n  await expectInViewport(page, completedActions.nth(0));\n  await expectInViewport(page, completedActions.nth(1));\n\n  expect(fatalErrors).toEqual([]);`,
            'phone completed action contract',
          );
          fs.writeFileSync(testPath, test);
          NODE
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate release and Browser QA
        run: npm run qa:release
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui-ux-overhaul-02.css tests/release/release.spec.ts
          git diff --cached --check
          git commit -m "Keep completed shelf actions visible on phones"
          git push origin HEAD:ui-ux-overhaul-02
