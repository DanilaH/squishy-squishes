name: Feel Art Audio Pass 01 Validation

on:
  push:
    branches:
      - feel-art-audio-pass-01

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feel-art-audio-pass-01
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply feel pass source patch
        run: node scripts/apply-feel-art-audio-pass-01.mjs
      - name: Diff check
        run: git diff --check
      - name: Install dependencies
        run: npm install
      - name: Validate Pages and Yandex builds
        run: npm run release:check
      - name: Commit validated source and remove temporary tooling
        run: |
          rm scripts/apply-feel-art-audio-pass-01.mjs
          rm .github/workflows/feel-art-audio-pass-01-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+DanilaH@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts scripts .github/workflows/feel-art-audio-pass-01-validation.yml
          git commit -m "Wire cosmetic presentation tiers into craft results"
          git push origin HEAD:feel-art-audio-pass-01
