name: Library Hall art exports (preview branch)
on:
  push:
    branches: [feat/library-hall-pages-preview]
    paths:
      - scripts/build-library-hall.mjs
      - .github/workflows/library-art-exports.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'DanilaH/squishy-squishes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build source-pinned game sprites
        run: node scripts/build-library-hall.mjs
      - name: Commit verified binary outputs to preview branch only
        shell: bash
        run: |
          git add src/experiments/phaser/library-assets/*.webp src/experiments/phaser/library-assets/sources.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'assets(library): commit reproducible WebP exports'
            git push origin HEAD:feat/library-hall-pages-preview
          fi
