name: Finalize Production Skeleton 01

on:
  push:
    branches:
      - production-skeleton-01

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production-skeleton-01
          fetch-depth: 0
      - run: python scripts/finalize_production_skeleton_01.py
      - run: git diff --check
      - name: Commit final corrections
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/i18n/ru.ts docs/IMPLEMENTATION_ROADMAP.md docs/PRODUCT.md docs/CONTENT_AND_PROGRESSION.md docs/TECHNICAL_DIRECTION.md
          git commit -m "Finalize Production Skeleton 01 boundaries"
          git push origin HEAD:production-skeleton-01
