name: Library Hall real-browser QA (preview)
on:
  push:
    branches: [feat/library-hall-pages-preview]
    paths:
      - 'src/experiments/phaser/libraryHallPreview.*'
      - 'src/experiments/phaser/libraryHallPolish.css'
      - 'src/experiments/phaser/studioPagesPreview.ts'
      - 'src/experiments/phaser/library-assets/**'
      - 'scripts/verify-library-art.mjs'
      - 'tests/phaser-pages/library-hall-*.spec.ts'
      - '.github/workflows/library-hall-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  library-hall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify approved Library art provenance and immutable hashes
        run: node scripts/verify-library-art.mjs
      - name: Strict TS and staged Pages build
        run: npm run pages:build
      - name: Real empty, saved-toy, paging, fallback and 11-viewport geometry QA
        run: npx playwright test --config=playwright.phaser-pages.config.ts tests/phaser-pages/library-hall-integration.spec.ts tests/phaser-pages/library-hall-responsive.spec.ts
      - name: Upload real browser screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-hall-real-browser-review
          path: |
            test-results/**/library-hall-*.png
            test-results/**/library-hall-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Full existing Phaser Pages regression suite
        run: npm run pages:qa
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: library-hall-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
