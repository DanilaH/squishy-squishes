name: Phase 7B Validation

on:
  push:
    branches:
      - phase-7b-mushroom-paw

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: phase-7b-mushroom-paw
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
