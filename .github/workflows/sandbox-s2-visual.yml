name: Sandbox S2 Temporary Visual Review

on:
  push:
    branches:
      - sandbox-pivot-s2-library

permissions:
  contents: read

jobs:
  capture:
    if: startsWith(github.event.head_commit.message, 'Capture Sandbox S2 production visuals')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Capture production library lifecycle
        run: npx playwright test tests/release/s2-visual.spec.ts --config=playwright.release.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: sandbox-s2-visuals
          path: s2-visuals
          if-no-files-found: error
