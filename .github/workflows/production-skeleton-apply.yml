name: Apply Production Skeleton 01

on:
  push:
    branches:
      - production-skeleton-01

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: production-skeleton-01
          fetch-depth: 0

      - name: Apply bounded patches
        run: |
          python scripts/patch_surface_runtime.py
          python scripts/patch_app_contract.py
          python scripts/patch_app_activity.py
          python scripts/patch_app_copy.py

      - name: Validate diff
        run: git diff --check

      - name: Commit source refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/VerticalSliceApp.ts src/squish/SquishSurface.ts
          git commit -m "Wire production runtime boundaries into slice"
          git push origin HEAD:production-skeleton-01
