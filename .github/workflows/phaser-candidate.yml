name: Phaser M2 Candidate QA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  candidate-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test isolated Phaser candidate
        run: npm run candidate:qa
      - name: Upload passing candidate screenshots
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phaser-m2-candidate-evidence
          path: phaser-candidate-evidence/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Upload candidate failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phaser-m2-candidate-failure
          path: |
            test-results
            playwright-report
            phaser-candidate-evidence
          if-no-files-found: ignore
          retention-days: 14
