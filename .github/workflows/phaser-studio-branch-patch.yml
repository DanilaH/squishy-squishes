name: Temporary Phaser Studio Branch Patch

on:
  push:
    branches:
      - migration/phaser-real-studio

permissions:
  contents: write

jobs:
  branch-patch:
    if: github.ref == 'refs/heads/migration/phaser-real-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Fix strict Phaser studio types
        run: node scripts/migration/fix-phaser-studio-types.mjs
      - name: Commit type fixes to migration branch only
        shell: bash
        run: |
          if git diff --quiet -- src/sandbox/PhaserSquishSurface.ts; then
            echo 'Already patched: no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/sandbox/PhaserSquishSurface.ts
          git commit -m 'Fix strict Phaser studio TypeScript errors'
          git push origin HEAD:migration/phaser-real-studio
