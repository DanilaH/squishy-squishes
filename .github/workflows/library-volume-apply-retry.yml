name: Apply accepted Library volume (fixed migration)
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: ['.github/workflows/library-volume-apply-retry.yml']
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'DanilaH/squishy-squishes' && github.ref == 'refs/heads/feat/library-visual-recovery-sep21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Apply exact-source integration with corrected geometry and typed uniforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          original = Path('.github/workflows/library-volume-apply.yml').read_text()
          script = original.split("          python3 - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          old = '    gl.useProgram(this.program);\n  gl.drawElements'
          assert old in script, 'Expected exact migration indentation is missing'
          script = script.replace(old, '    gl.useProgram(this.program);\n    gl.drawElements')
          old = "    const studioSource = showLegacy ? document.createElement('canvas') : current;\n  if (showLegacy) renderLibraryThumbnail(studioSource, toy, 512);"
          assert old in script, 'Expected exact lab source indentation is missing'
          script = script.replace(old, "    const studioSource = showLegacy ? document.createElement('canvas') : current;\n    if (showLegacy) renderLibraryThumbnail(studioSource, toy, 512);")
          old = '...sides[toy.materialId]'
          assert old in script, 'Expected spread of non-tuple uniform color is missing'
          script = script.replace(old, 'sides[toy.materialId][0], sides[toy.materialId][1], sides[toy.materialId][2]')
          old_assert = "assert text.count(old) == 1, f'{name}: expected exactly one match for {old[:65]!r}'"
          assert old_assert in script
          script = script.replace(old_assert, "assert text.count(old) >= 1, f'{name}: missing {old[:65]!r}'")
          exec(compile(script, 'reviewed-hall-migration', 'exec'), {'__name__': '__main__'})
          PY
      - run: npm ci
      - name: Typecheck and build Pages
        run: npm run pages:build
      - name: Commit only integrated code, tests and docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/experiments/phaser/libraryVolumeAlbedo.ts src/experiments/phaser/libraryVolumeMesh.ts src/experiments/phaser/libraryVolumeReview.ts src/experiments/phaser/studioPagesPreview.ts src/sandbox/libraryThumbnail.ts tests/phaser-pages/library-hall-*.spec.ts docs/LIBRARY_VISUAL_RECOVERY_2026-09-21.md
          git diff --cached --check
          git commit -m 'feat(library): integrate owner-accepted volume mesh into ordinary Pages Hall'
          git push origin HEAD:feat/library-visual-recovery-sep21
