name: Finish accepted Library volume surface integrity
on:
  push:
    branches: [feat/library-visual-recovery-sep21]
    paths: ['.github/workflows/library-volume-apply-retry.yml']
permissions:
  contents: write
jobs:
  integrity:
    if: github.repository == 'DanilaH/squishy-squishes' && github.ref == 'refs/heads/feat/library-visual-recovery-sep21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Fill missing mesh front texels and reset renderer provenance on repaint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          mesh = Path('src/experiments/phaser/libraryVolumeMesh.ts')
          content = mesh.read_text()
          old = '''    if (paint.a < 0.025) discard;
              alpha = paint.a;'''
          # The silhouette is already geometrically clipped. Sampling beyond the
          # albedo at deep concavities must not reveal black/transparent seams.
          assert content.count(old) == 1, 'Mesh texel guard no longer matches source'
          content = content.replace(old, '''    if (paint.a < 0.025) paint = vec4(uSideColor, 1.0);
              alpha = paint.a;''')
          mesh.write_text(content)
          thumbnail = Path('src/sandbox/libraryThumbnail.ts')
          content = thumbnail.read_text()
          old = '  if (pagesMaterialLighting && pagesRenderer?.(context, toy, THUMBNAIL_SIZE * rasterScale as 256 | 512)) {'
          assert content.count(old) == 1
          content = content.replace(old, '  if (pagesMaterialLighting) delete canvas.dataset.libraryRenderer;\n' + old)
          thumbnail.write_text(content)
          PY
      - run: npm ci
      - name: Strict typecheck and Pages build
        run: npm run pages:build
      - name: Commit implementation and remove disposable migration runners
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/experiments/phaser/libraryVolumeMesh.ts src/sandbox/libraryThumbnail.ts
          git rm .github/workflows/library-volume-apply.yml .github/workflows/library-volume-apply-retry.yml
          git diff --cached --check
          git commit -m 'fix(library): seal mesh alpha seams and clear stale renderer labels'
          git push origin HEAD:feat/library-visual-recovery-sep21
