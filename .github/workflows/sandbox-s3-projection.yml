name: Sandbox S3 Temporary Accessory Projection

on:
  push:
    branches:
      - sandbox-pivot-s3-decor

permissions:
  contents: write

jobs:
  projection:
    if: startsWith(github.event.head_commit.message, 'Arm Sandbox S3 accessory projection validation')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s3-decor
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply accessory projection prototype
        run: node scripts/apply-sandbox-s3-accessory-probe.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run release:check
      - name: Prove accessory follows real mesh deformation
        run: npx playwright test tests/release/s3-accessory-projection.spec.ts --config=playwright.release.config.ts
      - name: Commit validated projection prototype
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sandbox/SandboxApp.ts src/sandbox-core.css
          git diff --cached --check
          git commit -m "Prove S3 accessory projection on deforming mesh"
          git push origin HEAD:sandbox-pivot-s3-decor
