name: Sandbox S3 Temporary Permanent QA

on:
  push:
    branches:
      - sandbox-pivot-s3-decor

permissions:
  contents: write

jobs:
  qa:
    if: startsWith(github.event.head_commit.message, 'Arm Sandbox S3 permanent QA validation')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: sandbox-pivot-s3-decor
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Apply permanent S3 QA
        run: |
          node scripts/apply-sandbox-s3-qa.mjs
          node scripts/fix-sandbox-s3-qa.mjs
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run complete release QA
        run: npm run qa:release
      - name: Commit validated permanent QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/release.spec.ts
          git diff --cached --check
          git commit -m "Protect Sandbox S3 with permanent Browser QA"
          git push origin HEAD:sandbox-pivot-s3-decor
