name: Sandbox Polish Visual QA

on:
  push:
    branches:
      - sandbox-polish-feedback-01

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Capture visual states
        run: npx playwright test tests/release/polish-visual.tmp.spec.ts --config=playwright.release.config.ts --reporter=line
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-polish-visual
          path: visual-artifacts
          if-no-files-found: ignore
          retention-days: 7
